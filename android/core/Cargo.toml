[package]
name = "spotifast-android"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace: the desktop crate above must not pick this up.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
log = "0.4"
serde_json = "1"
# Already in the tree through librespot-core.
sha1 = "0.10"
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# The same librespot fork as the desktop app (see ../../Cargo.toml), with
# webpki roots: Android's certificate store is not a file rustls can read.
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { version = "0.8", default-features = false }
librespot-metadata = { version = "0.8", default-features = false }
librespot-protocol = { version = "0.8", default-features = false }

# For the desktop's Cast and Spotify Connect receiver code (src/cast.rs,
# src/zeroconf.rs), the same versions the desktop uses.
serde = { version = "1", features = ["derive"] }
protobuf = "3"
md-5 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
ring = "0.17"
thiserror = "2"
rand = "0.9"
pbkdf2 = "0.12"
base64 = "0.22"
hmac = "0.12"
aes = "0.8"
ctr = "0.9"
mdns-sd = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "blocking"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[patch.crates-io]
librespot-audio = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-connect = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-core = { path = "vendor/librespot-core" }
librespot-metadata = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-oauth = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-playback = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-protocol = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The other librespot crates reach librespot-core by path inside the fork's
# git checkout; point those at the vendored copy too, so one copy exists.
[patch."https://github.com/crmne/librespot"]
librespot-core = { path = "vendor/librespot-core" }
