name: Android APK

# Builds the Android app (android/) and publishes the APK on the
# "android-latest" prerelease, so a phone can download it directly.
on:
  push:
    paths:
      - android/**
      - src/effects.rs
      - src/eq.rs
      - src/limiter.rs
      - src/resample.rs
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Rust for Android
        working-directory: android/core
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/core

      - name: Build the native core
        working-directory: android/core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: cargo ndk -t arm64-v8a --platform 26 -o ../app/src/main/jniLibs build --release

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk spotifast-custom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: spotifast-custom-apk
          path: spotifast-custom.apk

      - name: Publish to the android-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Open this page on your phone and tap spotifast-custom.apk to install."
          git tag -f android-latest "$GITHUB_SHA"
          git push -f origin refs/tags/android-latest
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --prerelease --title "Android (latest build)" --notes "$notes"
          else
            gh release create android-latest --prerelease --title "Android (latest build)" --notes "$notes"
          fi
          gh release upload android-latest spotifast-custom.apk --clobber
